# File Organizer Configuration

# File type categories and extensions
file_types:
  images:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .bmp
    - .tiff
    - .webp
    - .heic
    - .raw
  
  videos:
    - .mp4
    - .mov
    - .avi
    - .mkv
    - .wmv
    - .flv
    - .webm
    - .m4v
    - .3gp
  
  documents:
    - .pdf
    - .doc
    - .docx
    - .txt
    - .rtf
    - .odt
    - .xls
    - .xlsx
    - .ppt
    - .pptx
  
  audio:
    - .mp3
    - .wav
    - .flac
    - .aac
    - .ogg
    - .m4a
    - .wma
  
  archives:
    - .zip
    - .rar
    - .7z
    - .tar
    - .gz
    - .bz2

# Default settings
defaults:
  use_creation_date: false
  recursive: true
  dry_run: false
  log_level: INFO

# Ignore patterns (files/folders to skip)
ignore_patterns:
  - .DS_Store
  - Thumbs.db
  - .git/
  - .svn/
  - node_modules/
  - __pycache__/